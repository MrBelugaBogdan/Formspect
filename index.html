<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Formspec Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Бічна панель-палітра -->
        <div id="palette">
            <h3>Елементи</h3>
            <div id="element-list">
                <!-- Динамічно заповнюється з elements.js -->
            </div>
            <hr>
            <h3>Налаштування полотна</h3>
            <label>Розмір (ширина, висота):</label>
            <input type="number" id="canvas-width" value="10" min="1" max="20" step="0.5">
            <input type="number" id="canvas-height" value="8" min="1" max="20" step="0.5">
            <br>
            <label>Версія formspec:</label>
            <select id="formspec-version">
                <option value="6">6</option>
                <option value="7" selected>7</option>
            </select>
            <hr>
            <label>Фон (колір або текстура):</label>
            <input type="text" id="bg-color" placeholder="#00000000 або назва текстури" value="">
            <small>Наприклад: #0fc5f7, default_item_bg.png, gui_formbg.png</small>
            <br><br>
            <button id="btn-generate">📋 Згенерувати formspec</button>
            <textarea id="output-formspec" readonly rows="10" placeholder="Тут зʼявиться код..."></textarea>
        </div>

        <!-- Полотно (canvas) -->
        <div id="canvas-container">
            <div id="canvas"></div>
        </div>

        <!-- Панель властивостей (зʼявляється при виділенні) -->
        <div id="properties-panel">
            <h3>Властивості</h3>
            <div id="props-content">
                <p>Виберіть елемент на полотні</p>
            </div>
            <hr>
            <h3>Шари (z-order)</h3>
            <ul id="layer-list"></ul>
            <button id="btn-delete-selected">🗑️ Видалити вибраний</button>
        </div>
    </div>

    <script src="elements.js"></script>
    <script src="renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
