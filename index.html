<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Formspec Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Бічна панель -->
        <div id="palette">
            <h3>🎨 Елементи (перетягни на полотно)</h3>
            <div id="element-list"></div>
            
            <hr>
            <h3>⚙️ Налаштування</h3>
            
            <label>Розмір (ширина x висота):</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="canvas-width" value="8" min="1" max="20" step="0.5">
                <span>x</span>
                <input type="number" id="canvas-height" value="9" min="1" max="20" step="0.5">
            </div>
            
            <label>Версія formspec:</label>
            <select id="formspec-version">
                <option value="6">6</option>
                <option value="7" selected>7</option>
            </select>
            
            <label>Фон (колір або текстура):</label>
            <input type="text" id="bg-input" placeholder="#00000000 або текстура" value="default_item_bg.png">
            <small>#0fc5f7 / gui_formbg.png / default_item_bg.png</small>
            
            <hr>
            <h3>📦 Експорт</h3>
            
            <label>Тип виводу:</label>
            <select id="export-type">
                <option value="raw">Тільки formspec</option>
                <option value="book_empty">/giveme books:empty</option>
                <option value="book_written">/giveme books:written</option>
            </select>
            
            <div id="book-fields" style="display: none;">
                <label>Власник:</label>
                <input type="text" id="book-owner" value="Деси">
                <label>Опис:</label>
                <input type="text" id="book-desc" value="Інвентар">
                <label>Текст сторінки:</label>
                <textarea id="book-text" rows="2">Травон 2 - ржера поль лізна</textarea>
                <label>Назва книги:</label>
                <input type="text" id="book-title" value="Крисли Bag">
            </div>
            
            <button id="btn-copy">📋 Копіювати в буфер</button>
            <textarea id="output-formspec" readonly rows="12" placeholder="Код з'явиться тут автоматично..."></textarea>
        </div>

        <!-- Полотно -->
        <div id="canvas-container">
            <div id="canvas-wrapper">
                <div id="canvas"></div>
            </div>
        </div>

        <!-- Панель властивостей -->
        <div id="properties-panel">
            <h3>📝 Властивості</h3>
            <div id="props-content">
                <p>Виберіть елемент на полотні</p>
            </div>
            <hr>
            <h3>📚 Шари (порядок)</h3>
            <ul id="layer-list"></ul>
            <button id="btn-delete-selected">🗑️ Видалити вибраний</button>
        </div>
    </div>

    <script src="elements.js"></script>
    <script src="renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
